<title>Gas Reassessment Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout concept: phone-first trainer with a fixed bottom tab bar; one task per screen, big tap targets, readings set in a mono face like a gauge display. */
:root {
  --bg: #EEF3F4;
  --surface: #FFFFFF;
  --ink: #0F2A33;
  --muted: #52676F;
  --line: #D3DFE2;
  --accent: #0B5563;
  --accent-ink: #FFFFFF;
  --tint: #E1EFF2;
  --flame: #C9560A;
  --good: #1B7A4B;
  --good-bg: #E1F3E9;
  --bad: #B3261E;
  --bad-bg: #FBE5E3;
  --warn: #7A4F00;
  --warn-bg: #FFF1CF;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C181D; --surface: #13242B; --ink: #E5EEF0; --muted: #9AB0B7; --line: #27414A;
    --accent: #62C6D6; --accent-ink: #07242B; --tint: #16323A; --flame: #FF8A3D;
    --good: #55C98A; --good-bg: #12301F; --bad: #FF8C84; --bad-bg: #3A1815; --warn: #F2C35B; --warn-bg: #3A2D0E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C181D; --surface: #13242B; --ink: #E5EEF0; --muted: #9AB0B7; --line: #27414A;
  --accent: #62C6D6; --accent-ink: #07242B; --tint: #16323A; --flame: #FF8A3D;
  --good: #55C98A; --good-bg: #12301F; --bad: #FF8C84; --bad-bg: #3A1815; --warn: #F2C35B; --warn-bg: #3A2D0E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-inline: 16px; padding-block: 0 96px;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 720px; margin-inline: auto; }
.top { display: flex; align-items: center; gap: 10px; padding-block: 14px 10px; }
.top svg { flex: none; }
.brandbar { background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-top:14px; display:flex; justify-content:center; }
.brandbar img { display:block; width:100%; max-width:300px; height:auto; }
.top { padding-block: 12px 10px; }

.top .name { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .01em; line-height: 1; }
.top .sub { color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; }
h2 { font-size: 26px; }
h3 { font-size: 19px; }
p { margin: 0; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.panel.flat { border-radius: 6px; }

/* buttons */
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.btn {
  appearance: none; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  border-radius: 8px; padding: 12px 16px; font-weight: 600; min-height: 46px; text-align: center;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn.quiet { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.small { min-height: 38px; padding: 8px 12px; font-size: 14px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.block { width: 100%; }
button:focus-visible, input:focus-visible, summary:focus-visible, .tab:focus-visible {
  outline: 3px solid var(--flame); outline-offset: 2px;
}

/* tab bar */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(6, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tab {
  appearance: none; background: none; border: 0; border-top: 3px solid transparent;
  padding: 10px 2px 11px; font-family: var(--font-display); font-weight: 600; font-size: 15px;
  letter-spacing: .02em; color: var(--muted); min-height: 52px;
}
.tab[aria-current="page"] { color: var(--accent); border-top-color: var(--flame); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.stat b { display: block; font-family: var(--font-mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }

/* topic bars */
.topic { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding-block: 9px; border-top: 1px solid var(--line); }
.topic:first-child { border-top: 0; }
.bar { grid-column: 1 / -1; height: 8px; border-radius: 2px; background: var(--tint); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar i.low { background: var(--bad); }
.bar i.mid { background: var(--flame); }
.bar i.high { background: var(--good); }

/* quiz */
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 4px; background: var(--tint); color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: .04em; }
.chk { display: inline-block; padding: 0 5px; margin-inline: 2px; border-radius: 3px; background: var(--warn-bg); color: var(--warn); font-size: 11px; font-weight: 700; letter-spacing: .06em; vertical-align: 1px; }
.timer { font-family: var(--font-mono); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.progress { height: 6px; background: var(--tint); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--flame); }
.qtext { font-size: 19px; font-weight: 600; line-height: 1.3; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  appearance: none; display: grid; grid-template-columns: 28px 1fr; gap: 10px; text-align: left; align-items: start;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 12px; min-height: 50px;
}
.opt .l { font-family: var(--font-mono); font-weight: 600; color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--tint); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt[disabled] { cursor: default; }
.feedback { border-radius: 8px; padding: 12px 14px; }
.feedback.good { background: var(--good-bg); color: var(--ink); border-left: 4px solid var(--good); }
.feedback.bad { background: var(--bad-bg); color: var(--ink); border-left: 4px solid var(--bad); }
.feedback b { font-family: var(--font-display); font-size: 18px; }
.scoreline { font-family: var(--font-mono); font-size: 44px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
.review { border-top: 1px solid var(--line); padding-block: 10px; }
.review summary { cursor: pointer; font-weight: 600; }
.menu-item {
  appearance: none; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; width: 100%;
}
.menu-item:hover { border-color: var(--accent); }
.menu-item .mono { color: var(--muted); font-size: 13px; }

/* flashcard */
.card {
  appearance: none; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 22px 18px; min-height: 190px; display: flex; flex-direction: column; justify-content: center; gap: 10px;
}
.card .side { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.card .txt { font-size: 21px; font-weight: 600; line-height: 1.3; }
.card.back { background: var(--tint); border-color: var(--accent); }

/* scenarios */
.cls { display: grid; gap: 8px; }
.cls .opt { grid-template-columns: 58px 1fr; }
.cls .opt .l { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
.tag { display: inline-block; font-family: var(--font-display); font-weight: 700; font-size: 20px; padding: 0 8px; border-radius: 4px; }
.tag.ID { background: var(--bad-bg); color: var(--bad); }
.tag.AR { background: var(--warn-bg); color: var(--warn); }
.tag.NCS { background: var(--tint); color: var(--accent); }

/* drills */
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { appearance: none; border: 0; background: var(--surface); padding: 10px; font-weight: 600; min-height: 44px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 600; }
.input {
  width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; min-height: 46px;
  font-family: var(--font-mono); font-size: 18px;
}
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.readout { background: var(--ink); color: var(--bg); border-radius: 8px; padding: 14px; display: grid; gap: 6px; }
.readout div { display: flex; justify-content: space-between; gap: 12px; }
.readout .mono { font-size: 20px; }
.work { font-family: var(--font-mono); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }

/* tasks */
.check { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; padding-block: 8px; border-top: 1px solid var(--line); }
.check:first-of-type { border-top: 0; }
.check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent); }
.list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; }
.note { background: var(--warn-bg); color: var(--ink); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .progress i, .bar i { transition: width .3s ease; } }
</style>

"use strict";
var D = {"topics": ["Gas & combustion", "Emergencies", "Pipework & meters", "CO & analysis", "Law & practice", "Unsafe situations", "Calculations", "Flues", "Ventilation", "Appliances", "Testing & purging"], "questions": [{"id": "g1", "topic": "Gas & combustion", "q": "What is the main component of natural gas?", "opts": ["Propane", "Methane", "Butane", "Carbon monoxide"], "ans": 1, "why": "Natural gas is mostly methane (CH4)."}, {"id": "g2", "topic": "Gas & combustion", "q": "Compared with air, natural gas is:", "opts": ["Heavier", "About the same", "Lighter", "A liquid at room temperature"], "ans": 2, "why": "Relative density is about 0.6, so a leak rises."}, {"id": "g3", "topic": "Gas & combustion", "q": "The flammable range of natural gas in air is about:", "opts": ["1% to 3%", "5% to 15%", "20% to 40%", "50% to 70%"], "ans": 1, "why": "Below 5% is too lean and above 15% is too rich."}, {"id": "g4", "topic": "Emergencies", "q": "What is the National Gas Emergency number?", "opts": ["101", "111", "0800 111 999", "0300 303 0303"], "ans": 2, "why": "0800 111 999 is free and open 24 hours a day."}, {"id": "g5", "topic": "Pipework & meters", "q": "An ECV handle at right angles to the pipe means the valve is:", "opts": ["Open", "Closed", "Half open", "Faulty"], "ans": 1, "why": "It is a quarter-turn valve: in line is open, across is closed."}, {"id": "g6", "topic": "Gas & combustion", "q": "Which substance is added to natural gas so a leak can be smelled?", "opts": ["Methane", "Mercaptan", "Hydrogen", "Nitrogen"], "ans": 1, "why": "Mercaptans such as THT give the rotten-egg smell."}, {"id": "g7", "topic": "CO & analysis", "q": "Which gas, produced by incomplete combustion, is colourless, odourless and toxic?", "opts": ["Carbon dioxide", "Oxygen", "Carbon monoxide", "Water vapour"], "ans": 2, "why": "Carbon monoxide (CO) cannot be seen or smelled."}, {"id": "g8", "topic": "CO & analysis", "q": "The general pass level for the CO/CO2 ratio on a domestic appliance is:", "opts": ["0.0004", "0.004", "0.04", "0.4"], "ans": 1, "why": "0.004 or below is normally acceptable; above it, investigate."}, {"id": "g9", "topic": "Pipework & meters", "q": "The nominal pressure at the outlet of a domestic gas meter is about:", "opts": ["2 mbar", "21 mbar", "37 mbar", "75 mbar"], "ans": 1, "why": "Natural gas is nominally supplied at 21 mbar."}, {"id": "g10", "topic": "Pipework & meters", "q": "The maximum pressure drop from the meter to an appliance is:", "opts": ["0.1 mbar", "1 mbar", "5 mbar", "10 mbar"], "ans": 1, "why": "Pipework must be sized so the drop does not exceed 1 mbar."}, {"id": "g11", "topic": "Pipework & meters", "q": "Where is main equipotential bonding to gas pipework made?", "opts": ["Within 600 mm of the meter outlet, consumer's side", "At the boiler", "Upstream of the ECV", "At the cooker"], "ans": 0, "why": "Within 600 mm of the meter outlet and before any branch, using a BS 951 clamp."}, {"id": "g12", "topic": "Pipework & meters", "q": "The minimum size of the bonding conductor for gas pipework is:", "opts": ["2.5 mm²", "6 mm²", "10 mm²", "16 mm²"], "ans": 2, "why": "10 mm² green and yellow conductor."}, {"id": "g13", "topic": "Law & practice", "q": "A landlord must keep a gas safety record for:", "opts": ["6 months", "1 year", "2 years", "10 years"], "ans": 2, "why": "Records are kept for 2 years."}, {"id": "g14", "topic": "Unsafe situations", "q": "An appliance classified as Immediate Danger should be:", "opts": ["Left in use with advice", "Recorded only", "Made safe and not left in use", "Ignored if the customer objects"], "ans": 2, "why": "ID means make safe and do not leave the appliance in use."}, {"id": "g15", "topic": "Calculations", "q": "A boiler uses 0.03 m³ in 120 s. CV = 39.0 MJ/m³. Gross input is about:", "opts": ["2.5 kW", "9.75 kW", "11.7 kW", "35 kW"], "ans": 1, "why": "Gas rate 0.9 m³/h; 0.9 × 39 ÷ 3.6 = 9.75 kW."}, {"id": "g16", "topic": "Calculations", "q": "What is the net input for a 9.75 kW gross input (natural gas)?", "opts": ["8.9 kW", "10.7 kW", "9.75 kW", "1.1 kW"], "ans": 0, "why": "Net = gross ÷ 1.1 = 8.86 kW."}, {"id": "g17", "topic": "Calculations", "q": "1 mbar is equal to:", "opts": ["10 Pa", "100 Pa", "1,000 Pa", "10,000 Pa"], "ans": 1, "why": "1 mbar = 100 Pa."}, {"id": "g18", "topic": "Gas & combustion", "q": "Yellow tipping on a flame usually indicates:", "opts": ["Too much primary air", "Too little primary air or poor combustion", "Perfect combustion", "Low water pressure"], "ans": 1, "why": "Yellow tips mean not enough primary air or other causes of incomplete combustion."}, {"id": "g19", "topic": "Gas & combustion", "q": "Flame lift is typically caused by:", "opts": ["Pressure or primary air too high", "A full condensate trap", "A cold flue", "Low voltage"], "ans": 0, "why": "Lift is caused by too high a pressure or too much primary air."}, {"id": "g20", "topic": "Flues", "q": "Which appliance takes air from the room and uses a natural draught flue?", "opts": ["Room-sealed", "Open-flued", "Flueless", "Fanned balanced flue"], "ans": 1, "why": "Open-flued appliances use room air and a natural draught flue."}, {"id": "g21", "topic": "Flues", "q": "Which test shows whether an open flue is clearing combustion products?", "opts": ["Soundness test", "Spillage test", "Gas rate test", "Pressure test"], "ans": 1, "why": "The spillage test checks for products escaping at the draught diverter."}, {"id": "g22", "topic": "Ventilation", "q": "Which appliance type does not normally need ventilation for combustion air?", "opts": ["Open-flued boiler", "Room-sealed boiler", "Flueless heater", "Gas cooker"], "ans": 1, "why": "Room-sealed appliances take air from outside through a sealed circuit."}, {"id": "g23", "topic": "Ventilation", "q": "A typical open-flue room ventilation rule is 5 cm² per kW above what net input?", "opts": ["3 kW", "5 kW", "7 kW", "10 kW"], "ans": 2, "why": "5 cm² per kW of net input above 7 kW (confirm in BS 5440-2)."}, {"id": "g24", "topic": "Appliances", "q": "Condensate from a condensing boiler is:", "opts": ["Alkaline", "Neutral", "Acidic", "Flammable"], "ans": 2, "why": "It is acidic, roughly pH 3 to 5."}, {"id": "g25", "topic": "Appliances", "q": "A common cold-weather fault on condensing boilers is:", "opts": ["Frozen condensate pipe", "Frozen gas", "Frozen meter", "Flue gas freezing"], "ans": 0, "why": "A frozen condensate pipe can lock the boiler out."}, {"id": "g26", "topic": "Appliances", "q": "What does a thermocouple do?", "opts": ["Proves the pilot flame and keeps the gas valve open", "Measures gas pressure", "Detects gas leaks", "Creates a spark"], "ans": 0, "why": "It produces a small voltage from the pilot flame to hold the solenoid open."}, {"id": "g27", "topic": "Appliances", "q": "What does a flame failure device do?", "opts": ["Turns on the pump", "Shuts off gas if the flame goes out", "Lights the burner", "Measures CO"], "ans": 1, "why": "It stops the gas if the flame is lost."}, {"id": "g28", "topic": "Emergencies", "q": "If you smell gas, what should you do first?", "opts": ["Turn on the lights to look", "Open windows, avoid flames and switches, turn off at the ECV if safe, call 0800 111 999", "Light a match to test", "Wait for it to pass"], "ans": 1, "why": "Ventilate, avoid ignition sources, isolate if safe, and call the emergency number."}, {"id": "g29", "topic": "Law & practice", "q": "What is shown on the back of a Gas Safe ID card?", "opts": ["Home address", "The categories of gas work the engineer can do", "Vehicle registration", "Bank details"], "ans": 1, "why": "The back lists the categories the engineer is qualified for."}, {"id": "g30", "topic": "CO & analysis", "q": "Which is NOT a symptom of CO poisoning?", "opts": ["Headache", "Dizziness", "Nausea", "A strong smell of rotten eggs"], "ans": 3, "why": "CO has no smell. The rotten-egg smell comes from the odorant in natural gas."}, {"id": "g31", "topic": "CO & analysis", "q": "Which is a warning sign of CO at an appliance?", "opts": ["Black sooty stains", "Cold radiators", "Noisy pipes", "Low water pressure"], "ans": 0, "why": "Soot and staining are warning signs of incomplete combustion."}, {"id": "g32", "topic": "Gas & combustion", "q": "Propane is:", "opts": ["Lighter than air", "Heavier than air", "The same as air", "Non-flammable"], "ans": 1, "why": "Propane is about 1.5 times as dense as air and collects at low level."}, {"id": "g33", "topic": "CO & analysis", "q": "Which instrument measures CO and CO2 in flue gases?", "opts": ["Manometer", "Flue gas analyser", "Stethoscope", "Hygrometer"], "ans": 1, "why": "A combustion analyser (BS 7967) measures CO and CO2."}, {"id": "g34", "topic": "Gas & combustion", "q": "Primary air is air that:", "opts": ["Mixes with gas before the burner ports", "Reaches the flame from around it", "Is drawn up the chimney", "Is used for cooling"], "ans": 0, "why": "Primary air is mixed with the gas in the burner."}, {"id": "g35", "topic": "Pipework & meters", "q": "Gas pipework must never be used as:", "opts": ["A gas carrier", "A bonded conductor", "An earth electrode", "A pipe with an isolation valve"], "ans": 2, "why": "It must not be used as an earth electrode."}, {"id": "g36", "topic": "CO & analysis", "q": "A CO alarm for a home should comply with:", "opts": ["BS EN 50291", "BS 6891", "IGEM/UP/1B", "BS 5440"], "ans": 0, "why": "BS EN 50291 covers domestic CO alarms."}, {"id": "g37", "topic": "Law & practice", "q": "Which of these needs a Gas Safe registered engineer?", "opts": ["Any work on a gas appliance", "Only boilers", "Only landlords", "Only commercial premises"], "ans": 0, "why": "Competent, Gas Safe registered engineers must do all gas work in their categories."}, {"id": "g38", "topic": "Testing & purging", "q": "When purging pipework, gas should be released:", "opts": ["Into the occupied room", "To a safe place outside, away from ignition sources", "Into a cupboard", "Next to the boiler"], "ans": 1, "why": "Purge outside and away from ignition sources."}, {"id": "g39", "topic": "Calculations", "q": "An appliance has input 24 kW and output 22 kW. Its efficiency is about:", "opts": ["83.3%", "91.7%", "109%", "54%"], "ans": 1, "why": "22 ÷ 24 × 100 = 91.7%."}, {"id": "g40", "topic": "Appliances", "q": "What does ODS stand for on a gas fire?", "opts": ["Oxygen depletion sensor", "Open draught system", "Outlet differential switch", "Operating dial setting"], "ans": 0, "why": "An oxygen depletion sensor shuts the pilot off if oxygen in the room falls."}, {"id": "m1", "topic": "Law & practice", "q": "Before starting work you should:", "opts": ["Begin work immediately to save time", "Show your Gas Safe ID, explain the work and assess the risks", "Ask only for payment details", "Turn off the electricity at the consumer unit"], "ans": 1, "why": "Introduce yourself, show ID, explain the work and carry out a risk assessment."}, {"id": "m2", "topic": "Testing & purging", "q": "A let-by test checks whether:", "opts": ["The ECV passes gas when it is closed", "The flue is clear", "The appliance is the right size", "The bonding is in place"], "ans": 0, "why": "Let-by is gas passing a valve that should be shut."}, {"id": "m3", "topic": "Testing & purging", "q": "During a tightness test the gauge keeps falling after stabilisation and the drop exceeds the permitted figure. You should:", "opts": ["Pass the installation", "Find the leak with LDF, repair it and repeat the test", "Open the ECV and carry on", "Raise the pressure"], "ans": 1, "why": "A failed test means finding and fixing the leak, then repeating the test."}, {"id": "m4", "topic": "Testing & purging", "q": "Which of these must you never use to look for a gas leak?", "opts": ["Leak detection fluid", "A gas detector", "A naked flame", "A manometer test"], "ans": 2, "why": "Never use a naked flame."}, {"id": "m5", "topic": "Testing & purging", "q": "Before purging pipework you should:", "opts": ["Remove ignition sources and ventilate the area", "Light the appliance", "Close all windows", "Switch on extractor fans"], "ans": 0, "why": "Remove ignition sources and ventilate before purging."}, {"id": "m6", "topic": "Calculations", "q": "For a gas rate test, which appliances should be running?", "opts": ["All appliances", "Only the appliance under test", "Only the cooker", "None"], "ans": 1, "why": "Everything else, including pilots, should be off."}, {"id": "m7", "topic": "CO & analysis", "q": "A flue gas analyser should be zeroed:", "opts": ["In the flue", "In fresh air", "Next to the boiler", "After the test"], "ans": 1, "why": "Zero it in fresh air before use."}, {"id": "m8", "topic": "CO & analysis", "q": "CO = 36 ppm and CO₂ = 9.0%. The ratio is:", "opts": ["0.0004", "0.004", "0.04", "0.4"], "ans": 0, "why": "36 ÷ 90,000 = 0.0004."}, {"id": "m9", "topic": "Unsafe situations", "q": "An open-flued appliance fails the spillage test. You should:", "opts": ["Leave it in use and advise the customer", "Treat it as unsafe: turn it off, label it and follow the unsafe situations procedure", "Raise the burner pressure", "Remove the vent"], "ans": 1, "why": "A failed spillage test means products may be entering the room: make safe."}, {"id": "m10", "topic": "Appliances", "q": "A thermocouple is part of:", "opts": ["Flame supervision", "Ignition", "Condensate drainage", "Pressure regulation"], "ans": 0, "why": "It holds the gas valve open only while the pilot flame heats it."}, {"id": "m11", "topic": "Unsafe situations", "q": "A 'Do not use' label is fixed to:", "opts": ["The appliance or control that has been turned off", "The meter box lid only", "The customer's front door", "The flue terminal"], "ans": 0, "why": "It goes on the appliance or its control so it isn't used by mistake."}, {"id": "m12", "topic": "Unsafe situations", "q": "A warning notice should be given to:", "opts": ["The neighbour", "The person responsible for the premises", "The gas supplier only", "No one"], "ans": 1, "why": "The person responsible, ideally with a signature."}, {"id": "m13", "topic": "Pipework & meters", "q": "Which valve isolates a single appliance?", "opts": ["Emergency control valve", "Appliance isolation valve", "Meter regulator", "Pressure relief valve"], "ans": 1, "why": "Each appliance should have its own isolation valve."}, {"id": "m14", "topic": "Pipework & meters", "q": "The meter regulator:", "opts": ["Reduces and holds the supply pressure steady", "Measures CO", "Provides ventilation", "Earths the pipework"], "ans": 0, "why": "It keeps the supply at the nominal pressure."}, {"id": "m15", "topic": "Ventilation", "q": "An appliance in a compartment usually needs:", "opts": ["No ventilation", "High-level and low-level ventilation", "Only a low-level vent", "Only a window"], "ans": 1, "why": "Compartments usually need high and low vents; check the MIs."}, {"id": "m16", "topic": "Calculations", "q": "Gross input equals:", "opts": ["Net × 1.1", "Net ÷ 1.1", "Net × 0.9", "Net + 1.1"], "ans": 0, "why": "Net = gross ÷ 1.1, so gross = net × 1.1."}, {"id": "m17", "topic": "Gas & combustion", "q": "Light-back is typically caused by:", "opts": ["Gas pressure too low or too much primary air", "A frozen condensate pipe", "A full meter", "Too many vents"], "ans": 0, "why": "The flame burns back to the injector."}, {"id": "m18", "topic": "Flues", "q": "Which test shows whether flue products are being drawn away?", "opts": ["Flue flow test", "Let-by test", "Gas rate test", "Bonding test"], "ans": 0, "why": "Use smoke at the draught diverter."}, {"id": "m19", "topic": "Flues", "q": "You suspect an old flue is asbestos cement. You should:", "opts": ["Break it up to check", "Stop, avoid disturbing it and follow HSE guidance", "Drill it", "Burn it"], "ans": 1, "why": "Do not disturb suspect asbestos."}, {"id": "m20", "topic": "Law & practice", "q": "Landlord gas safety records should be given to existing tenants within:", "opts": ["7 days", "28 days", "3 months", "12 months"], "ans": 1, "why": "28 days of the check."}, {"id": "m21", "topic": "Flues", "q": "A flue terminal where people could touch it should have:", "opts": ["A terminal guard", "A bigger vent", "A second ECV", "A CO alarm only"], "ans": 0, "why": "Guards stop contact and damage."}, {"id": "m22", "topic": "Gas & combustion", "q": "LPG leaks are especially dangerous in cellars because LPG:", "opts": ["Is lighter than air", "Is heavier than air and collects at low level", "Is odourless", "Is non-flammable"], "ans": 1, "why": "LPG sinks and collects in low spaces."}, {"id": "m23", "topic": "Law & practice", "q": "'MI' stands for:", "opts": ["Maximum input", "Manufacturer's instructions", "Meter index", "Mains isolation"], "ans": 1, "why": "Manufacturer's instructions."}, {"id": "m24", "topic": "Appliances", "q": "A boiler locks out in freezing weather. A likely cause is:", "opts": ["Frozen condensate pipe", "Frozen meter", "Frozen gas main", "Too much ventilation"], "ans": 0, "why": "A frozen condensate pipe can stop the boiler."}, {"id": "m25", "topic": "Unsafe situations", "q": "A customer refuses to let you disconnect an appliance classed as Immediate Danger. You should:", "opts": ["Leave quietly", "Explain the danger, issue the warning notice and follow the procedure, including the Gas Emergency Service if required", "Reduce the price", "Turn the appliance up"], "ans": 1, "why": "Never simply leave; follow the unsafe situations procedure."}, {"id": "x1", "topic": "Emergencies", "q": "After a suspected gas escape, which action should you avoid?", "opts": ["Opening windows", "Operating electrical switches", "Turning off at the ECV if safe", "Calling 0800 111 999"], "ans": 1, "why": "Switches can create a spark, so avoid them along with flames."}, {"id": "x2", "topic": "Emergencies", "q": "If CO poisoning is suspected, you should:", "opts": ["Open a window and stay in the room", "Turn the appliance off, get everyone into fresh air and seek medical help", "Wait to see if symptoms pass", "Turn the heating up"], "ans": 1, "why": "Get people out into fresh air, turn the appliance off and get medical help."}, {"id": "x3", "topic": "Ventilation", "q": "Permanent ventilation openings must be:", "opts": ["Closable in winter", "Always open and unobstructed", "Covered with a cloth", "Smaller than 1 cm²"], "ans": 1, "why": "Permanent means it cannot be closed or blocked."}, {"id": "x4", "topic": "Ventilation", "q": "Extractor fans can cause problems for open-flued appliances because they may:", "opts": ["Pull combustion products back into the room", "Raise gas pressure", "Cool the meter", "Increase the gas rate"], "ans": 0, "why": "They can overcome the flue draught, so test spillage with fans running."}, {"id": "x5", "topic": "Flues", "q": "A room-sealed boiler takes its combustion air from:", "opts": ["The room", "Outside, through the flue system", "The gas supply", "A cupboard only"], "ans": 1, "why": "Room-sealed appliances have a sealed circuit to outside."}, {"id": "x6", "topic": "Pipework & meters", "q": "Gas pipework passing through a wall should be:", "opts": ["Sleeved and sealed", "Left bare in the cavity", "Buried in plaster with no protection", "Joined inside the wall"], "ans": 0, "why": "Sleeve and seal the pipe, and avoid joints in concealed spaces."}], "decks": {"facts": [{"id": "f0", "front": "Gas Emergency number?", "back": "0800 111 999 (free, 24 hours)."}, {"id": "f1", "front": "Main component and density of natural gas?", "back": "Methane, relative density about 0.6 (lighter than air)."}, {"id": "f2", "front": "Flammable range of natural gas?", "back": "About 5% to 15% in air."}, {"id": "f3", "front": "Which odorant is added to natural gas?", "back": "A mercaptan (such as THT), which smells of rotten eggs."}, {"id": "f4", "front": "Nominal pressure at the meter outlet?", "back": "21 mbar."}, {"id": "f5", "front": "Maximum pressure drop from meter to appliance?", "back": "1 mbar."}, {"id": "f6", "front": "ECV handle in line with the pipe means?", "back": "Open. Across the pipe means closed."}, {"id": "f7", "front": "Main bonding to gas pipework?", "back": "10 mm² conductor, within 600 mm of the meter outlet (consumer side), BS 951 clamp."}, {"id": "f8", "front": "CO/CO₂ ratio limit for a domestic appliance?", "back": "0.004 or below is normal. Above that, investigate."}, {"id": "f9", "front": "Convert CO₂ % to ppm?", "back": "1% = 10,000 ppm."}, {"id": "f10", "front": "Gross to net input (natural gas)?", "back": "Net = gross ÷ 1.1."}, {"id": "f11", "front": "Gross input formula?", "back": "Gas rate (m³/h) × CV (MJ/m³) ÷ 3.6 = kW gross."}, {"id": "f12", "front": "Gas rate formula?", "back": "Volume (m³) × 3600 ÷ time (seconds)."}, {"id": "f13", "front": "1 mbar in pascals?", "back": "100 Pa."}, {"id": "f14", "front": "Landlord gas safety rules?", "back": "Annual check, keep the record for 2 years, give tenants a copy within 28 days (new tenants before moving in)."}, {"id": "f15", "front": "Open-flue tests?", "back": "Visual check, flue flow test and spillage test, with extractor fans running."}, {"id": "f16", "front": "Yellow tipping means?", "back": "Too little primary air or poor combustion (dirty burner, blocked flue, poor ventilation)."}, {"id": "f17", "front": "Flame lift versus light-back?", "back": "Lift: pressure or primary air too high. Light-back: pressure too low or too much primary air."}, {"id": "f18", "front": "Unsafe situations in one line?", "back": "ID: make safe. AR: turn off and label. NCS: advise and record."}, {"id": "f19", "front": "Condensate from a condensing boiler?", "back": "Acidic (about pH 3 to 5). Drain through a trap and a pipe with a continuous fall; outside runs can freeze."}], "gloss": [{"id": "g0", "front": "AR", "back": "At Risk: an unsafe situation that is not immediate but could become dangerous."}, {"id": "g1", "front": "CV", "back": "Calorific value: the heat released by burning a unit volume of gas, in MJ per cubic metre."}, {"id": "g2", "front": "ECV", "back": "Emergency control valve: the main gas shut-off valve at the meter."}, {"id": "g3", "front": "FFD", "back": "Flame failure device: shuts off gas if the flame goes out."}, {"id": "g4", "front": "GIUSP", "back": "Gas Industry Unsafe Situations Procedure."}, {"id": "g5", "front": "GSIUR", "back": "Gas Safety (Installation and Use) Regulations 1998."}, {"id": "g6", "front": "ID", "back": "Immediate Danger: an unsafe situation that must be made safe straight away."}, {"id": "g7", "front": "LDF", "back": "Leak detection fluid: bubbles show gas leaks."}, {"id": "g8", "front": "Let-by", "back": "Gas passing a valve that should be shut."}, {"id": "g9", "front": "MI", "back": "Manufacturer's instructions."}, {"id": "g10", "front": "MPD", "back": "Maximum permitted pressure drop during a tightness test."}, {"id": "g11", "front": "NCS", "back": "Not to Current Standards."}, {"id": "g12", "front": "ODS", "back": "Oxygen depletion sensor."}, {"id": "g13", "front": "Overgassing", "back": "Supplying more gas to an appliance than it is designed for."}, {"id": "g14", "front": "Primary air", "back": "Air mixed with gas inside the burner before combustion."}, {"id": "g15", "front": "Room-sealed", "back": "Appliance with a sealed combustion circuit that takes air from and discharges to outside."}, {"id": "g16", "front": "Spillage", "back": "Combustion products escaping into the room instead of going up the flue."}, {"id": "g17", "front": "Stabilisation", "back": "The waiting period in a tightness test so the temperature and pressure settle."}, {"id": "g18", "front": "Terminal", "back": "The outlet of a flue where combustion products leave the building."}, {"id": "g19", "front": "U6", "back": "A standard domestic gas meter size (maximum flow 6 cubic metres per hour)."}], "viva": [{"id": "v0", "front": "What would you do on arrival if you smelled gas?", "back": "No flames or switches; open doors and windows; turn off at the ECV if safe; leave the building; call 0800 111 999; do not return until safe."}, {"id": "v1", "front": "How would you check ventilation for an open-flued boiler?", "back": "Identify the type and position of vents; check they are permanent and unobstructed; check the free area against the standard and MIs; then test spillage with extractors on."}, {"id": "v2", "front": "Why do you allow a stabilisation period in a tightness test?", "back": "Temperature and pressure changes in the pipework can make the gauge move, so you wait for it to settle before judging a leak."}, {"id": "v3", "front": "How do you decide between Immediate Danger, At Risk and Not to Current Standards?", "back": "Use the current unsafe situations procedure. Ask whether there is an immediate danger, whether it could become dangerous, or whether it is simply not to today's standards."}, {"id": "v4", "front": "What are the signs of CO at an appliance or in a home?", "back": "Lazy yellow or orange flames, soot or staining, pilot going out, condensation; headaches, dizziness, nausea, collapse."}, {"id": "v5", "front": "What does a CO/CO₂ ratio of 0.004 tell you?", "back": "It is the usual limit for a domestic appliance. Higher means poor combustion that needs investigating."}, {"id": "v6", "front": "What is the difference between gross and net input?", "back": "Gross includes the heat from condensing the water vapour; net does not. For natural gas, net = gross ÷ 1.1."}, {"id": "v7", "front": "Where is main bonding made, and why?", "back": "Within 600 mm of the meter outlet, consumer's side, with 10 mm² conductor and a BS 951 clamp, to keep the pipework at the same electrical potential as the earth."}, {"id": "v8", "front": "What do you check on a gas cooker?", "back": "Ventilation, flexible hose and restraint, isolation valve, flame picture, flame failure devices, gas tap operation, stability and position."}, {"id": "v9", "front": "What records do you complete after a landlord check or service?", "back": "Results of checks and tests, defects found and actions, appliance details, date and your details; give a copy to the customer or tenant and keep the record."}, {"id": "v10", "front": "What do you tell the customer at handover?", "back": "How the appliance works, where the ECV is, what to do if they smell gas, CO alarm advice, and when the next service is due."}, {"id": "v11", "front": "What is your responsibility if you cannot fix a fault?", "back": "Make safe, tell the responsible person, give a warning notice and record it. Never leave an unsafe appliance in use."}, {"id": "v12", "front": "What is the difference between primary and secondary air?", "back": "Primary air mixes with the gas inside the burner; secondary air reaches the flame from around it."}, {"id": "v13", "front": "Why must you use gas-rated jointing materials?", "back": "Ordinary water-rated tapes and compounds may not be suitable for gas, and could cause a leak or deteriorate."}, {"id": "v14", "front": "What would you do if you suspected asbestos in an old flue?", "back": "Stop, do not disturb it, inform the customer and follow HSE guidance."}]}, "scenarios": [{"i": 0, "text": "A leak is found with LDF at a union on the supply side, upstream of the ECV, and it cannot be stopped.", "cls": "ID", "why": "Ventilate, avoid ignition sources, leave the building and call the Gas Emergency Service on 0800 111 999. Pipework upstream of the ECV is the gas transporter's responsibility."}, {"i": 1, "text": "A gas cooker flexible hose is cracked and perished. LDF shows no leak and there is no smell of gas.", "cls": "AR", "why": "Turn off at the isolation valve, label it, advise the customer and replace the hose before it is used again."}, {"i": 2, "text": "A gas hob has no isolation valve, but is otherwise sound and passes all tests.", "cls": "NCS", "why": "Advise the customer and record it. A valve should be fitted, but the hob is not in immediate danger."}, {"i": 3, "text": "An open-flued fire is in a room with no permanent vent. It passes the spillage test and CO readings are normal.", "cls": "AR", "why": "Inadequate ventilation could lead to spillage or CO. Turn off, label and advise until proper ventilation is fitted."}, {"i": 4, "text": "An open-flued boiler fails the spillage test, products are escaping into the room and the occupant has headaches.", "cls": "ID", "why": "Turn off, make safe, ventilate and give medical advice if needed. Do not leave it in use. Issue a warning notice."}, {"i": 5, "text": "A flue joint is leaking products into a bedroom cupboard, with staining on the wall.", "cls": "ID", "why": "Products are entering an occupied part of the building. Turn off, make safe and explain the danger."}, {"i": 6, "text": "A condensing boiler works correctly, but its condensate pipe is run outside in small-bore, uninsulated pipe.", "cls": "NCS", "why": "Advise on freeze risk and improvement; no need to disconnect."}, {"i": 7, "text": "A gas fire's thermocouple has been bypassed with a wire so the pilot can't shut off the gas.", "cls": "ID", "why": "A safety device has been defeated. Turn off and disconnect, remove the bypass or the appliance from use, and issue a warning notice."}], "tasks": [{"n": 1, "title": "Arrive, assess and prepare", "goal": "Show you work safely and professionally before you touch anything.", "need": "ID card, PPE, test equipment, warning notices and labels, a note of the risk assessment.", "steps": ["Introduce yourself, show your Gas Safe ID and explain the work.", "Ask about any smell of gas, symptoms such as headaches, and any known faults.", "Walk the job: find the meter and ECV, the appliances, ventilation and flue routes.", "Risk assess: ignition sources, escape routes, vulnerable occupants, access, suspected asbestos.", "Check your equipment works and is in calibration; zero the analyser in fresh air.", "Tell the customer what will be turned off and for how long."], "looks": ["Clear, polite communication with the customer", "A real risk assessment, spoken or written", "ECV located and its position explained", "Test equipment checked before use"], "slips": ["Starting work before checking equipment", "Not locating the ECV until it is needed", "Forgetting to ask about symptoms or smells"]}, {"n": 2, "title": "Visual inspection of the installation and appliance", "goal": "Spot anything unsafe or non-compliant before testing.", "need": "Torch, mirror, LDF, rating plate details, manufacturer's instructions.", "steps": ["Check the appliance type is suitable for the room and installed to the manufacturer's instructions.", "Inspect the meter, ECV, regulator and pipework: support, corrosion, sleeves, joints, damage.", "Check main bonding is present within 600 mm of the meter outlet (10 mm² conductor, BS 951 clamp).", "Check there is a working appliance isolation valve.", "Inspect flexible hoses for damage, kinks, position and restraint.", "Look for soot, staining, scorching, water leaks and signs of overheating.", "Check the data plate: gas type, input and appliance category.", "Check ventilation openings are permanent and unobstructed; check the visible flue and terminal.", "Check for a CO alarm and its date."], "looks": ["Methodical order, not random looking", "Spoken findings, including 'nothing found'", "Correct identification of non-compliance and what it means", "Notes made as you go"], "slips": ["Missing the isolation valve or bonding", "Not checking the data plate", "Calling a minor issue unsafe, or an unsafe one 'fine'"]}, {"n": 3, "title": "Tightness test (including let-by)", "goal": "Prove the installation does not leak, and record it.", "need": "Calibrated manometer, test adaptor, LDF, gas detector. Follow IGEM/UP/1B for the permitted pressure drop [CHECK].", "steps": ["Check all appliance valves and burner controls are closed; no ignition sources; area ventilated.", "Fit the manometer at a suitable test point and check it reads zero.", "Let-by test: with the ECV closed and the downstream pipework open to atmosphere, check the gauge does not rise.", "Pressurise to working pr
